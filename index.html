<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Kenai Peninsula house tour</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#f4f2ed; --card:#fff; --sunk:#edeae3; --ink:#191a17; --muted:#5f6660;
    --rule:#dcd9d1; --firm:#b4b0a6;
    --cph:#b3341f; --school:#2f6fa8; --park:#3f7d45; --gym:#7a4ca8; --trail:#a86a1f;
    --am:#1d6a63; --pm:#9a5b1f; --wed:#3b4f8a; --ok:#2f7d4f;
    --ui:"Barlow Semi Condensed",system-ui,sans-serif; --mono:"Azeret Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#14161a; --card:#1c1f24; --sunk:#171a1e; --ink:#e7e9e4; --muted:#9aa09a;
    --rule:#2e333a; --firm:#49505a;
    --cph:#f0714f; --school:#6fa8dc; --park:#74c38c; --gym:#b98fe0; --trail:#ddaa55;
    --am:#5fc5ba; --pm:#e0a35c; --wed:#8fa6e0; --ok:#6cc48c;}}
  :root[data-theme="dark"]{
    --ground:#14161a; --card:#1c1f24; --sunk:#171a1e; --ink:#e7e9e4; --muted:#9aa09a;
    --rule:#2e333a; --firm:#49505a;
    --cph:#f0714f; --school:#6fa8dc; --park:#74c38c; --gym:#b98fe0; --trail:#ddaa55;
    --am:#5fc5ba; --pm:#e0a35c; --wed:#8fa6e0; --ok:#6cc48c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:17px;
       line-height:1.4;padding-block:1rem 3rem;padding-inline:1rem;-webkit-font-smoothing:antialiased}
  .wrap{max-width:54rem;margin:0 auto}
  h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  .sub{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;
       text-transform:uppercase;margin-top:.25rem}

  .bar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.9rem 0;
       border-top:1px solid var(--firm);border-bottom:1px solid var(--firm);padding-block:.7rem}
  .tab{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
       padding:.5em .75em;border:1px solid var(--firm);background:transparent;color:var(--muted);
       cursor:pointer;border-radius:3px}
  .tab[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .tab.ghost{margin-left:auto;border-style:dashed}
  .tab.ghost[hidden]{display:none}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--school);outline-offset:2px}

  figure{margin:0 0 1rem}
  #map{height:52vh;min-height:21rem;background:var(--card);
       border:1px solid var(--rule);border-radius:4px}
  .maprow{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.4rem}
  .maprow .act{font-size:.6rem}
  .numpin{display:flex;align-items:center;justify-content:center;color:#fff;
          font-family:var(--mono);font-size:.72rem;font-weight:500;
          width:22px;height:22px;border-radius:50%;border:2px solid #fff;
          box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-family:var(--mono);font-size:.65rem;
          color:var(--muted);margin-top:.4rem}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.3rem;vertical-align:-1px}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin-bottom:.7rem;
        overflow:hidden}
  .card.hidden-house{opacity:.5}
  .card.expired .addr{text-decoration:line-through solid var(--cph)}

  .top{display:flex;gap:.6rem;padding:.7rem .8rem;align-items:flex-start;width:100%;
       background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .pin{font-family:var(--mono);font-size:.8rem;font-weight:500;color:#fff;background:var(--am);
       min-width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;
       border-radius:3px;flex:0 0 auto}
  .pin.pm{background:var(--pm)} .pin.wed{background:var(--wed)}
  .hd{min-width:0;flex:1 1 auto}
  .addr{font-weight:600;font-size:1.05rem;line-height:1.2;display:block}
  .when{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:.15rem;display:block}
  .price{text-align:right;font-family:var(--mono);font-weight:500;white-space:nowrap;flex:0 0 auto}
  .psf{display:block;font-size:.65rem;color:var(--muted);font-weight:400}
  .chev{flex:0 0 auto;color:var(--muted);font-size:.8rem;align-self:center;transition:transform .15s}
  .top[aria-expanded="true"] .chev{transform:rotate(90deg)}

  .facts{display:flex;flex-wrap:wrap;gap:.2rem .9rem;padding:0 .8rem .6rem;
         font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .facts b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  .acts{display:flex;gap:.4rem;flex-wrap:wrap;padding:.5rem .8rem;border-top:1px solid var(--rule);
        background:var(--sunk)}
  .act{font-family:var(--mono);font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;
       padding:.5em .7em;border:1px solid var(--firm);border-radius:3px;background:transparent;
       color:var(--muted);text-decoration:none;cursor:pointer;display:inline-block}
  .act.call{color:var(--ink);border-color:var(--ink)}
  .act.hide-btn{margin-left:auto}

  .body{border-top:1px solid var(--rule)}
  .pmap{height:14rem;background:var(--sunk);border-bottom:1px solid var(--rule)}
  .pmapnote{font-family:var(--mono);font-size:.58rem;color:var(--muted);padding:.35rem .8rem;
            border-bottom:1px solid var(--rule);letter-spacing:.04em}
  .near{padding:.55rem .8rem;border-bottom:1px solid var(--rule);display:grid;
        grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.3rem .8rem;font-size:.85rem}
  .near span{color:var(--muted)}
  .near b{font-weight:500;color:var(--ink)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem}
  .shots{display:flex;gap:.45rem;overflow-x:auto;padding:.6rem .8rem;border-bottom:1px solid var(--rule)}
  .shots figure{margin:0;flex:0 0 auto;width:72%;max-width:20rem}
  .shots img{width:100%;height:auto;display:block;border-radius:3px;border:1px solid var(--rule)}
  .shots figcaption{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:.25rem;line-height:1.35}
  .note{padding:.55rem .8rem;border-bottom:1px solid var(--rule);font-size:.9rem;background:var(--ground)}
  .agent{padding:.5rem .8rem;font-family:var(--mono);font-size:.67rem;color:var(--muted);
         display:flex;flex-wrap:wrap;gap:.2rem .8rem}
  .agent a{color:inherit}

  .flag{display:inline-block;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;
        text-transform:uppercase;padding:.15em .4em;border:1px solid currentColor;border-radius:2px;
        margin-left:.4rem;vertical-align:2px}
  .flag.moved{color:var(--pm)} .flag.exp{color:var(--cph)}
  .flag.approx{color:var(--muted)} .flag.gps{color:var(--ok)}
  .flag.v-yes{color:var(--ok);border-width:2px} .flag.v-no{color:var(--cph)}
  .flag.v-maybe{color:var(--pm)} .flag.v-none{color:var(--muted)}
  .card.rejected .addr{text-decoration:line-through solid var(--cph)}
  .card.rejected{opacity:.78}
  .cnote{padding:.6rem .8rem;border-bottom:1px solid var(--rule);font-size:.92rem;
         background:var(--sunk);border-left:3px solid var(--school)}
  .cnote .who{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;
              text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}

  h2{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
     color:var(--muted);font-weight:500;margin:1.4rem 0 .5rem}
  .empty{font-size:.9rem;color:var(--muted);padding:1.5rem .2rem;text-align:center}
  footer{margin-top:1.6rem;border-top:1px solid var(--firm);padding-top:.8rem;
         font-family:var(--mono);font-size:.65rem;line-height:1.7;color:var(--muted)}
  a.tel{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--firm)}
  .leaflet-container{background:#111;font-family:var(--ui)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

4","publicNote":"WINTERIZED on the sheet, but it looked furnished and in use. The 8 bed / 7 bath layout, commercial flooring and twin-vanity baths read as a care home rather than a family house - confirm the current use, zoning and any licensing before going further. Bluff lot with a steep ladder down to the beach; flagged on the walkthrough as a hazard.","photos":[{"cap":"Care-services literature left on the floor, over commercial sheet vinyl - the house appears to be in use as a care home, not a single family residence","file":"photos/northern-05-careflyer.jpg"},{"cap":"Living room: large window onto lawn and spruce, oak trim, furnished and in use despite the sheet listing it as winterized","file":"photos/northern-04-living.jpg"},{"cap":"Bathroom with two separate vanities side by side - shared-occupancy fit-out rather than a family bath","file":"photos/northern-06-bath.jpg"},{"cap":"New stair carpet. Audio: \"we just remodelled it a little bit\"","file":"photos/northern-01-stairs.jpg"},{"cap":"New carpet, fresh paint; garage-door track visible at left","file":"photos/northern-02-room.jpg"},{"cap":"Elevated rear deck over a steep drop - audio flags the railing as a concern","file":"photos/northern-03-deck.jpg"}]},{"day":"Tue AM","n":6,"addr":"530 W Riverview Avenue, Soldotna, AK 99669","price":670000,"bed":5,"bath":5,"sqft":3888,"lat":60.484201587858,"lon":-151.102060711597,"cphMi":1.6,"cphMin":7,"nearschool":"Redoubt Elementary (0.3 mi)","nearpark":"Centennial Park (0.4 mi)","neargym":"Soldotna Regional Sports Complex (0.6 mi)","neartrail":"Tsalteshi Trails (1.5 mi)","gpsLat":60.48455,"gpsLon":-151.1035,"gpsFrom":["20261103_121743","20261103_124628"],"visited":true,"nearchoice":"Cook Inlet Academy (PK-12) (0.9 mi)","time":"11:30 AM","mls":"#26-12134","agent":"Andrea Kircher, Century 21","phone":"","publicNote":"Vacant. BED COUNT DOES NOT MATCH: the sheet says 5, but only three were counted on the walkthrough (\"three total including a master\"). Plans on site show a 2007 addition - ask whether it was permitted and finaled, and whether the listed square footage includes it. Foundation flagged on the walkthrough; worth a structural look.","photos":[{"cap":"Architect\u0027s plan set left on the counter: front and rear elevations for an addition, dated 5/30/07. The two-storey wing is an addition, not original construction.","file":"photos/riverview-01-plans.jpg"},{"cap":"Kitchen slider onto a new cedar deck; grey shaker cabinets, new LVP floor","file":"photos/riverview-02-deck.jpg"},{"cap":"The large bonus room - new LVP, chair rail, windows on two walls. This is where the square footage is.","file":"photos/riverview-03-bonus.jpg"},{"cap":"The original 1971 section: darker cherry laminate and an older bath - a visible seam between old and new","file":"photos/riverview-04-original.jpg"},{"cap":"Side yard opening onto meadow, neighbour\u0027s house beyond the spruce","file":"photos/riverview-05-sideyard.jpg"}]},{"day":"Tue PM","n":1,"addr":"47489 Wispen Avenue, Kenai, AK 99611","price":719900,"bed":3,"bath":3,"sqft":3334,"lat":60.5143,"lon":-151.1605,"approx":false,"gpsLat":60.5143,"gpsLon":-151.1605,"gpsFrom":["20261103_132344"],"visited":true,"cphMi":8.0,"cphMin":17,"nearschool":"K-Beach Elementary (2.0 mi)","nearpark":"Centennial Park (3.2 mi)","neargym":"Anytime Fitness (0.5 mi)","neartrail":"Tsalteshi Trails (4.0 mi)","nearchoice":"Cook Inlet Academy (PK-12) (3.2 mi)","verdict":"Rejected","cnote":"Crossed off: “good for a family of four.” Even cramming the children into two rooms leaves no space for a live-in grandparent, though the bonus rooms are lovely. Fenced backyard but not much land — “only one tree,” so not the treehouse life. Suburban and good for kids biking. Great kitchen, open concept, mudroom garage, big garage with workbenches and real working space, big attic with no bathroom, and a pretty potential study with a picture window. Heated floors.","time":"2:00 - 3:00 PM","mls":"#26-9016","agent":"Mark Kottke, Jack 0.47786910669,"lon":-150.955405655929,"cphMi":7.8,"cphMin":19,"nearschool":"Soldotna Elementary (K-6) (4.0 mi)","nearpark":"Rotary Park (2.1 mi)","neargym":"The Fitness Place (3.9 mi)","neartrail":"Tsalteshi Trails (5.2 mi)","nearchoice":"Soldotna Montessori Charter (K-6) (4.0 mi)","time":"11:00 AM - 12:15 PM","mls":"#26-13016","agent":"Jennifer Howell, Jack White","phone":"(907) 394-4659","publicNote":""},{"day":"Wed","n":6,"addr":"39930 Sapphire Loop, Soldotna, AK 99669","price":849000,"bed":5,"bath":5,"sqft":5331,"lat":60.486106312211,"lon":-150.938087537093,"cphMi":7.2,"cphMin":17,"nearschool":"Soldotna Elementary (K-6) (4.5 mi)","nearpark":"Rotary Park (2.7 mi)","neargym":"The Fitness Place (4.3 mi)","neartrail":"Tsalteshi Trails (5.9 mi)","nearchoice":"Soldotna Montessori Charter (K-6) (4.5 mi)","time":"11:30 AM - 12:30 PM","mls":"#25-13471","agent":"Kelly Griebel, Century 21","phone":"(907) 398-7293","publicNote":"Listing shows EXPIRED - confirm it is still available before touring. Access arrangements are on the printed sheet."}],"amenities":[{"lon":-151.0771,"lat":60.49323,"name":"Central Peninsula Hospital","note":"The workplace this move is built around","kind":"hospital"},{"lon":-151.07064,"lat":60.49109,"name":"Soldotna Elementary (K-6)","note":"Verified attendance school for the Arrowhead area","kind":"school"},{"lon":-151.09595,"lat":60.4932,"name":"Soldotna High","note":"","kind":"school"},{"lon":-151.09976,"lat":60.48832,"name":"Redoubt Elementary","note":"","kind":"school"},{"lon":-151.14169,"lat":60.48623,"name":"K-Beach Elementary","note":"","kind":"school"},{"lon":-151.10064,"lat":60.45813,"name":"Skyview Middle","note":"","kind":"school"},{"lon":-151.21322,"lat":60.56131,"name":"Kenai Central High","note":"","kind":"school"},{"lon":-151.20628,"lat":60.56229,"name":"Kenai Middle","note":"","kind":"school"},{"lon":-151.10411,"lat":60.46274,"name":"Tsalteshi Trails","note":"Main ski/run/bike trail system, at Skyview","kind":"trail"},{"lon":-151.06 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";
  var D = window.TOUR || {stops:[],amenities:[]};
  var STOPS = D.stops || [], AM = D.amenities || [];
  var DAYS = ["Tue AM","Tue PM","Wed"];
  var cls = {"Tue AM":"","Tue PM":"pm","Wed":"wed"};
  var view = "all";
  var KEY = "tour.hidden.v1";

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function money(n){return "$"+Number(n).toLocaleString();}
  function idOf(s){return s.addr.split(",")[0].replace(/\W+/g,"-").toLowerCase();}

  // ---- hidden set: per-device, survives republishes. Never required for the page to work.
  var hidden = {};
  try{ hidden = JSON.parse(localStorage.getItem(KEY)||"{}") || {}; }catch(e){ hidden = {}; }
  function saveHidden(){ try{ localStorage.setItem(KEY, JSON.stringify(hidden)); }catch(e){} }
  function isHidden(s){ return !!hidden[idOf(s)]; }

  var showHidden = false;

  // ---- header ----
  var gps = STOPS.filter(function(s){return s.gpsLat;}).length;
  document.getElementById("sub").textContent =
    STOPS.length + " stops · " + gps + " confirmed by on-site GPS · built " +
    (D.generated||"").slice(0,10);

  // ================= overview map =================
  // Real tiles with roads and place names. The old hand-drawn SVG plotted dots on a blank
  // ground, which told you nothing about where anything actually was.
  var OV = null, ovStops = null, ovAm = null, ovStreet = null, ovSat = null, amOn = true;
  var DAYCOL = {"Tue AM":"#1d6a63","Tue PM":"#9a5b1f","Wed":"#3b4f8a"};
  var KINDCOL = {hospital:"#b3341f",school:"#2f6fa8",park:"#3f7d45",gym:"#7a4ca8",trail:"#a86a1f"};

  function initOverview(){
    if(OV || !window.L) return;
    var el = document.getElementById("map");
    if(!el) return;
    OV = L.map(el, {scrollWheelZoom:false});
    ovStreet = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19, attribution:'Esri'}).addTo(OV);
    ovSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19, attribution:'Esri, Maxar'});
    L.control.scale({imperial:true, metric:false}).addTo(OV);
    ovStops = L.layerGroup().addTo(OV);
    ovAm    = L.layerGroup().addTo(OV);

    document.getElementById("basemap").addEventListener("click", function(){
      var sat = OV.hasLayer(ovSat);
      if(sat){ OV.removeLayer(ovSat); ovStreet.addTo(OV); this.textContent = "Satellite"; }
      else   { OV.removeLayer(ovStreet); ovSat.addTo(OV);  this.textContent = "Street map"; }
    });
    document.getElementById("fitall").addEventListener("click", fitOverview);
    document.getElementById("togglam").addEventListener("click", function(){
      amOn = !amOn;
      if(amOn) ovAm.addTo(OV); else OV.removeLayer(ovAm);
      this.setAttribute("aria-pressed", amOn?"true":"false");
      this.textContent = amOn ? "Amenities on" : "Amenities off";
    });
  }

  function inView(s){
    if(view==="all") return true;
    if(view==="live") return !/^Rejected/i.test(s.verdict||"");
    return s.day===view;
  }

  function visibleStops(){
    return STOPS.filter(function(s){
      if(!s.lat) return false;
      if(!inView(s)) return false;
      if(isHidden(s) && !showHidden) return false;
      return true;
    });
  }

  function fitOverview(){
    if(!OV) return;
    var pts = visibleStops().map(function(s){ return [s.lat, s.lon]; });
    if(D.hospital) pts.push([D.hospital.lat, D.hospital.lon]);
    if(pts.length) OV.fitBounds(L.latLngBounds(pts).pad(0.12));
  }

  function drawOverview(){
    initOverview();
    if(!OV) return;                       // no Leaflet: page still works, map just absent
    ovStops.clearLayers(); ovAm.clearLayers();

    AM.forEach(function(a){
      var big = a.kind==="hospital";
      L.circleMarker([a.lat,a.lon], {radius: big?8:5, color:"#fff",
        weight: big?2:1, fillColor: KINDCOL[a.kind]||"#888", fillOpacity: big?1:.85})
        .bindPopup("<b>"+esc(a.name)+"</b>"+(a.note?"<br>"+esc(a.note):""))
        .addTo(ovAm);
    });

    visibleStops().forEach(function(s){
      var col = DAYCOL[s.day] || "#555";
      var icon = L.divIcon({className:"", iconSize:[22,22], iconAnchor:[11,11],
        html:'<div class="numpin" style="background:'+col+
             (isHidden(s)?';opacity:.45':'')+'">'+s.n+'</div>'});
      var psf = s.sqft ? " &middot; $"+Math.round(s.price/s.sqft)+"/sqft" : "";
      L.marker([s.lat,s.lon], {icon:icon, title:s.addr.split(",")[0]})
        .bindPopup('<b>'+esc(s.addr.split(",")[0])+'</b><br>'+money(s.price)+psf+
                   '<br>'+s.bed+' bd / '+s.bath+' ba &middot; '+Number(s.sqft).toLocaleString()+' sqft'+
                   (s.cphMi!=null ? '<br>'+s.cphMi+' mi to the hospital' : '')+
                   '<br><a href="#card-'+idOf(s)+'">Open this card</a>')
        .addTo(ovStops);
    });

    if(!OV._fittedOnce){ OV._fittedOnce = true; setTimeout(function(){ OV.invalidateSize(); fitOverview(); }, 80); }
    else fitOverview();
  }

  // ================= per-property satellite map =================
  var mapsMade = {};
  function makePropMap(el, s){
    if(mapsMade[el.id] || !window.L) return;
    mapsMade[el.id] = true;
    var m = L.map(el, {scrollWheelZoom:false, attributionControl:false}).setView([s.lat,s.lon], 17);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19}).addTo(m);
    L.circleMarker([s.lat,s.lon], {radius:9, color:'#fff', weight:2,
      fillColor: s.day==="Tue AM"?'#1d6a63':s.day==="Tue PM"?'#9a5b1f':'#3b4f8a',
      fillOpacity:1}).addTo(m).bindPopup("<b>"+esc(s.addr.split(",")[0])+"</b>");
    if(D.hospital){
      L.circleMarker([D.hospital.lat, D.hospital.lon], {radius:7, color:'#fff', weight:2,
        fillColor:'#b3341f', fillOpacity:1}).addTo(m).bindPopup("Central Peninsula Hospital");
    }
    L.control.scale({imperial:true, metric:false}).addTo(m);
    setTimeout(function(){ m.invalidateSize(); }, 60);
  }

  // ================= cards =================
  function nearRow(s){
    var bits=[];
    if(s.cphMi!=null) bits.push(['var(--cph)','Hospital','<b>'+s.cphMi+' mi</b> · '+s.cphMin+' min']);
    if(s.nearschool) bits.push(['var(--school)','Neighbourhood school',esc(s.nearschool)]);
    if(s.nearchoice) bits.push(['var(--school)','Charter / private',esc(s.nearchoice)]);
    if(s.nearpark)   bits.push(['var(--park)','Park',esc(s.nearpark)]);
    if(s.neargym)    bits.push(['var(--gym)','Gym',esc(s.neargym)]);
    if(s.neartrail)  bits.push(['var(--trail)','Trails',esc(s.neartrail)]);
    if(!bits.length) return '';
    return '<div class="near">'+bits.map(function(b){
      return '<div><span class="dot" style="background:'+b[0]+'"></span><span>'+b[1]+'</span><br>'+b[2]+'</div>';
    }).join('')+'</div>';
  }

  function cardHTML(s, i){
    var id = idOf(s);
    var psf = s.sqft ? Math.round(s.price/s.sqft) : null;
    var flags = '';
    if(/EXPIRED/i.test(s.publicNote||'')) flags += '<span class="flag exp">expired</span>';
    if(/MOVED/i.test(s.time||''))         flags += '<span class="flag moved">moved</span>';
    if(s.gpsLat)                          flags += '<span class="flag gps">gps</span>';
    else if(s.approx)                     flags += '<span class="flag approx">approx pin</span>';

    // Verdict from the handwritten tour sheet. This is the thing worth seeing first.
    var vcls = 'v-none', rejected = false;
    if(s.verdict){
      if(/^Rejected/i.test(s.verdict))            { vcls='v-no'; rejected = true; }
      else if(/Interested|Could live/i.test(s.verdict)) vcls='v-yes';
      else if(/Maybe|Mixed/i.test(s.verdict))     vcls='v-maybe';
      flags += '<span class="flag '+vcls+'">'+esc(s.verdict)+'</span>';
    }

    var h = '<article id="card-'+id+'" class="card'+(isHidden(s)?' hidden-house':'')+
            (rejected?' rejected':'')+
            (/EXPIRED/i.test(s.publicNote||'')?' expired':'')+'" data-id="'+id+'">';

    h += '<button class="top" type="button" aria-expanded="false" aria-controls="b-'+id+'">'+
         '<span class="pin '+cls[s.day]+'">'+s.n+'</span>'+
         '<span class="hd"><span class="addr">'+esc(s.addr.split(",")[0])+flags+'</span>'+
         '<span class="when">'+esc(s.day)+(s.time?' · '+esc(s.time):'')+'</span></span>'+
         '<span class="price">'+money(s.price)+(psf?'<span class="psf">$'+psf+'/sqft</span>':'')+'</span>'+
         '<span class="chev">›</span></button>';

    h += '<div class="facts"><span><b>'+s.bed+'</b> bd</span><span><b>'+s.bath+'</b> ba</span>'+
         '<span><b>'+Number(s.sqft).toLocaleString()+'</b> sqft</span>'+
         (s.mls?'<span>'+esc(s.mls)+'</span>':'')+'</div>';

    h += '<div class="body" id="b-'+id+'" hidden>';
    if(s.lat){
      h += '<div class="pmap" id="m-'+id+'"></div>'+
           '<div class="pmapnote">'+(s.gpsLat
             ? 'Pin set from the phone’s own GPS on site · satellite imagery &copy; Esri'
             : 'Pin is geocoded from the street address, not yet confirmed on site · imagery &copy; Esri')+
           '</div>';
    }
    if(s.cnote){
      h += '<div class="cnote"><span class="who">From the walkthrough notes</span>'+esc(s.cnote)+'</div>';
    }
    h += nearRow(s);
    if(s.photos && s.photos.length){
      h += '<div class="shots">'+s.photos.map(function(p){
        return '<figure><img loading="lazy" src="'+esc(p.file)+'" alt="'+esc(p.cap)+'">'+
               '<figcaption>'+esc(p.cap)+'</figcaption></figure>';}).join('')+'</div>';
    }
    if(s.publicNote) h += '<div class="note">'+esc(s.publicNote)+'</div>';
    if(s.agent||s.phone){
      h += '<div class="agent"><span>'+esc(s.agent||'')+'</span>'+
           (s.phone?'<a class="tel" href="tel:'+esc(s.phone.replace(/\D/g,''))+'">'+esc(s.phone)+'</a>':'')+
           '</div>';
    }
    h += '</div>';

    h += '<div class="acts">';
    if(s.phone) h += '<a class="act call" href="tel:'+esc(s.phone.replace(/\D/g,''))+'">Call agent</a>';
    if(s.lat)   h += '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lon+'">Directions</a>';
    if(s.model) h += '<a class="act" href="'+esc(s.model)+'">3D model</a>';
    h += '<a class="act" href="map.html">Parcel map</a>';
    h += '<button class="act hide-btn" type="button">'+(isHidden(s)?'Unhide':'Hide')+'</button>';
    h += '</div></article>';
    return h;
  }

  function render(){
    var list = document.getElementById("list");
    var shown = STOPS.filter(function(s){
      if(!inView(s)) return false;
      if(isHidden(s) && !showHidden) return false;
      return true;
    });
    var html = "";
    DAYS.forEach(function(day){
      var rows = shown.filter(function(s){return s.day===day;});
      if(!rows.length) return;
      html += '<h2>'+day+'</h2>' + rows.map(cardHTML).join("");
    });
    list.innerHTML = html || '<div class="empty">Nothing to show here. '+
      (Object.keys(hidden).length?'Everything in this view is hidden — use the Hidden button above.':'')+'</div>';
    wire();
    updateGhost();
    drawOverview();
  }

  function wire(){
    [].forEach.call(document.querySelectorAll(".card"), function(card){
      var id = card.getAttribute("data-id");
      var s = STOPS.filter(function(x){return idOf(x)===id;})[0];
      card.querySelector(".top").addEventListener("click", function(){
        var body = card.querySelector(".body");
        var open = this.getAttribute("aria-expanded")==="true";
        this.setAttribute("aria-expanded", open?"false":"true");
        body.hidden = open;
        if(!open && s && s.lat){
          var el = document.getElementById("m-"+id);
          if(el) makePropMap(el, s);
        }
      });
      var hb = card.querySelector(".hide-btn");
      if(hb) hb.addEventListener("click", function(){
        if(hidden[id]) delete hidden[id]; else hidden[id] = 1;
        saveHidden(); render();
      });
    });
  }

  function updateGhost(){
    var n = STOPS.filter(isHidden).length;
    var g = document.getElementById("ghost");
    if(!g) return;
    g.hidden = n===0;
    g.textContent = showHidden ? "Hiding "+n+" again" : "Show "+n+" hidden";
    g.setAttribute("aria-pressed", showHidden?"true":"false");
  }

  // ---- tabs ----
  (function(){
    var bar = document.getElementById("tabs");
    ["all","live"].concat(DAYS).forEach(function(v){
      var b=document.createElement("button");
      b.type="button"; b.className="tab";
      b.textContent = v==="all" ? "All stops" : v==="live" ? "Still in play" : v;
      b.setAttribute("aria-pressed", v===view?"true":"false");
      b.addEventListener("click",function(){
        view=v;
        [].forEach.call(bar.querySelectorAll(".tab:not(.ghost)"),function(t){t.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");
        render();
      });
      bar.appendChild(b);
    });
    var g=document.createElement("button");
    g.type="button"; g.className="tab ghost"; g.id="ghost"; g.hidden=true;
    g.addEventListener("click",function(){ showHidden=!showHidden; render(); });
    bar.appendChild(g);
  })();

  document.getElementById("foot").innerHTML =
    'Hidden houses are remembered on this device only — they are not shared and nothing is sent anywhere. '+
    'Prices, beds, baths and square footage come from the MLS sheet and are not independently verified. '+
    'Pins marked <span class="flag gps">gps</span> were set from the phone’s own location data on site; '+
    'the rest are geocoded from the street address and can sit a few hundred feet off. '+
    'Lockbox and keypad codes are deliberately not on this page.';

  render();
})();
</script>
</body>
</html>
