<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Parcel lines, wetlands and power corridors</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  :root{--ground:#f4f2ed;--card:#fff;--ink:#191a17;--muted:#5f6660;--rule:#dcd9d1;--firm:#b4b0a6;
        --parcel:#ffd400;--wet:#2bb3e0;--power:#ff3b1f;--ok:#2f7d4f;--bad:#b3341f;
        --ui:"Barlow Semi Condensed",system-ui,sans-serif;--mono:"Azeret Mono",ui-monospace,monospace}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#14161a;--card:#1c1f24;--ink:#e7e9e4;--muted:#9aa09a;--rule:#2e333a;--firm:#49505a;
    --ok:#6cc48c;--bad:#f0714f}}
  :root[data-theme="dark"]{--ground:#14161a;--card:#1c1f24;--ink:#e7e9e4;--muted:#9aa09a;
    --rule:#2e333a;--firm:#49505a;--ok:#6cc48c;--bad:#f0714f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:17px;
       padding-block:1rem 2rem;padding-inline:1rem}
  .wrap{max-width:62rem;margin:0 auto}
  a.back{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
         color:var(--muted);text-decoration:none}
  h1{margin:.5rem 0 0;font-size:1.45rem;font-weight:600;text-wrap:balance}
  .sub{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.2rem;letter-spacing:.04em}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
  button{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
         padding:.45em .7em;border:1px solid var(--firm);background:transparent;color:var(--muted);
         border-radius:3px;cursor:pointer}
  button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--parcel);outline-offset:2px}
  #map{height:62vh;min-height:24rem;border:1px solid var(--rule);border-radius:4px}
  .legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-family:var(--mono);font-size:.65rem;
          color:var(--muted);margin-top:.5rem}
  .legend i{display:inline-block;width:14px;height:4px;margin-right:.35rem;vertical-align:3px}
  table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.86rem}
  th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--rule)}
  th{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
     color:var(--muted);font-weight:500}
  td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--card)}
  .over{color:var(--bad)} .under{color:var(--ok)}
  .wrapt{overflow-x:auto}
  .note{margin-top:1rem;background:var(--card);border:1px solid var(--firm);
        border-left:3px solid var(--power);padding:.7rem .85rem;font-size:.9rem;
        color:var(--muted);line-height:1.5}
  .note strong{color:var(--ink)}
  .leaflet-container{background:#111;font-family:var(--ui)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">&larr; Back to the tour</a>
  <h1>Parcel lines, wetlands and power corridors</h1>
  <div class="sub" id="sub">Loading&hellip;</div>

  <div class="tabs" id="tabs"></div>
  <div id="map"></div>
  <div class="tabs" id="layers">
    <button type="button" id="btnBorough" aria-pressed="true">Borough land</button>
    <button type="button" id="btnPrivate" aria-pressed="false">Private parcels</button>
    <button type="button" id="btnRefuge" aria-pressed="true">Federal refuge</button>
  </div>
  <div class="legend">
    <span><i style="background:var(--parcel)"></i>The listing&rsquo;s lot</span>
    <span><i style="background:#3f7d45"></i>Borough land &mdash; open to casual use</span>
    <span><i style="background:#8a8f86"></i>Borough-owned, not casual use</span>
    <span><i style="background:#d08cc0"></i>Private parcel</span>
    <span><i style="background:#2f8f7a"></i>Federal refuge (Kenai NWR)</span>
    <span><i style="background:var(--wet)"></i>Mapped wetland</span>
    <span><i style="background:var(--power)"></i>115 kV transmission</span>
  </div>

  <div class="sub" id="note2" style="margin-top:.4rem"></div>
  <div class="wrapt"><table id="tbl"></table></div>
  <div class="note" id="note"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";
  // Grid-sampled wetland fraction, only for the three parcels that were sampled.
  var WET = { "575 Pace": 71, "36880 Kendanemken": 24, "40248 Arrowhead": 0 };

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function money(n){return "$"+Number(n||0).toLocaleString();}

  var map = L.map('map', {scrollWheelZoom:true}).setView([60.503,-151.03], 11);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19, attribution:'Imagery &copy; Esri, Maxar'}).addTo(map);
  L.control.scale({imperial:true, metric:false}).addTo(map);

  // Keys are "number + first word", which turns "530 W Riverview Avenue" into "530 W".
  // For anything shown to a human, use the street name instead.
  var SUFFIX = /\s+(Avenue|Ave|Street|St|Drive|Dr|Road|Rd|Circle|Cir|Loop|Way|Court|Ct|Lane|Ln|Boulevard|Blvd|Highway|Hwy)\.?$/i;
  function label(p){
    var street = String(p.addr || p.key || '').split(',')[0]
                   .replace(/^\d+\s+/, '').replace(SUFFIX, '');
    return street || p.key;
  }

  function ringsToLatLng(rings){
    return rings.map(function(r){ return r.map(function(p){ return [p[1], p[0]]; }); });
  }

  // ---- Borough land: green where the public may walk, grey dashed where not. ----
  var boroughLayer = L.layerGroup().addTo(map);
  fetch('boroughland.json').then(function(r){ return r.json(); }).then(function(d){
    (d.parcels||[]).forEach(function(p){
      L.polygon(ringsToLatLng(p.rings),
        p.casual ? {color:'#3f7d45', weight:2, opacity:.95, fillColor:'#3f7d45', fillOpacity:.32}
                 : {color:'#8a8f86', weight:1, opacity:.75, fill:false, dashArray:'4 3'})
       .bindPopup('<b>Kenai Peninsula Borough</b><br>Parcel '+esc(p.id)+'<br>'+
                  (p.ac!=null?p.ac+' acres<br>':'')+(p.useType?esc(p.useType)+'<br>':'')+
                  (p.casual ? '<b style="color:#2f7d4f">Open to public casual use</b>'
                            : 'Borough-owned — not listed for casual use'))
       .addTo(boroughLayer);
    });
  }).catch(function(){});

  // Federal refuge. It is absent from the assessor's parcel layer, so without this it
  // renders as blank ground and reads as if it were unowned.
  var refugeLayer = L.layerGroup().addTo(map);
  fetch('refuge.json').then(function(r){ return r.json(); }).then(function(d){
    if(!(d.rings||[]).length) return;
    L.polygon(ringsToLatLng(d.rings),
      {color:'#2f8f7a', weight:2, opacity:.95, fillColor:'#2f8f7a', fillOpacity:.18})
     .bindPopup('<b>Kenai National Wildlife Refuge</b><br>Federal land, open to the public')
     .addTo(refugeLayer);
  }).catch(function(){});

  document.getElementById('btnRefuge').addEventListener('click', function(){
    var on = map.hasLayer(refugeLayer);
    if(on) map.removeLayer(refugeLayer); else refugeLayer.addTo(map);
    this.setAttribute('aria-pressed', on?'false':'true');
  });

  document.getElementById('btnBorough').addEventListener('click', function(){
    var on = map.hasLayer(boroughLayer);
    if(on) map.removeLayer(boroughLayer); else boroughLayer.addTo(map);
    this.setAttribute('aria-pressed', on?'false':'true');
  });

  // ---- Private parcels: fetched for whatever is on screen, so the file stays small. ----
  var privLayer = L.layerGroup(), privOn = false, privBusy = false;
  var PRIV_SVC = 'https://services.arcgis.com/ba4DH9pIcqkXJVfl/arcgis/rest/services/' +
                 'Redacted_Parcels_view/FeatureServer/0/query';
  function loadPrivate(){
    if(!privOn || privBusy || map.getZoom() < 14) return;
    privBusy = true;
    var b = map.getBounds();
    var body = new URLSearchParams({
      geometry: JSON.stringify({xmin:b.getWest(), ymin:b.getSouth(),
                                xmax:b.getEast(), ymax:b.getNorth(),
                                spatialReference:{wkid:4326}}),
      geometryType:'esriGeometryEnvelope', inSR:'4326', outSR:'4326',
      spatialRel:'esriSpatialRelIntersects',
      outFields:'PARCEL_ID,PHYSICAL_ADDRESSES,ACREAGE,ASSESSED_VALUE',
      returnGeometry:'true', maxAllowableOffset:'0.00008',
      resultRecordCount:'400', f:'json'
    });
    fetch(PRIV_SVC, {method:'POST', body:body}).then(function(r){ return r.json(); })
      .then(function(d){
        privLayer.clearLayers();
        (d.features||[]).forEach(function(f){
          if(!f.geometry || !f.geometry.rings) return;
          L.polygon(ringsToLatLng(f.geometry.rings),
            {color:'#d08cc0', weight:1, opacity:.85, fill:false})
           .bindPopup('<b>'+esc(f.attributes.PHYSICAL_ADDRESSES||'Private parcel')+'</b><br>'+
                      'Parcel '+esc(f.attributes.PARCEL_ID)+'<br>'+
                      (f.attributes.ACREAGE!=null?f.attributes.ACREAGE+' acres<br>':'')+
                      'Assessed '+money(f.attributes.ASSESSED_VALUE))
           .addTo(privLayer);
        });
        document.getElementById('note2').textContent =
          (d.features||[]).length + ' parcels drawn for this view';
      }).catch(function(){}).then(function(){ privBusy = false; });
  }
  document.getElementById('btnPrivate').addEventListener('click', function(){
    privOn = !privOn;
    this.setAttribute('aria-pressed', privOn?'true':'false');
    if(privOn){ privLayer.addTo(map); loadPrivate(); }
    else { map.removeLayer(privLayer); document.getElementById('note2').textContent=''; }
  });
  map.on('moveend zoomend', loadPrivate);

  Promise.all([
    fetch('parcels.json').then(function(r){ return r.json(); }),
    fetch('gis-data.json').then(function(r){ return r.json(); }).catch(function(){ return null; })
  ]).then(function(res){
    var P = res[0], G = res[1];
    var parcels = P.parcels || [];

    if(G){
      (G.wetlands||[]).forEach(function(w){
        L.polygon(ringsToLatLng(w.rings), {color:'#2bb3e0',weight:1,opacity:.75,fillOpacity:.28})
         .bindPopup('<b>'+esc(w.geocomp||'Wetland')+'</b><br>'+(w.acres||0).toFixed(1)+' acres')
         .addTo(map);
      });
      (G.lines||[]).forEach(function(l){
        (l.paths||[]).forEach(function(path){
          L.polyline(path.map(function(p){ return [p[1],p[0]]; }),
            {color:'#ff3b1f',weight:3,opacity:.95})
            .bindPopup('<b>'+l.kv+' kV transmission</b><br>'+esc(l.owner)).addTo(map);
        });
      });
    }

    var bounds = {}, all = L.latLngBounds([]);
    parcels.forEach(function(p){
      var poly = L.polygon(ringsToLatLng(p.rings),
        {color:'#ffd400', weight:3, opacity:1, fill:false}).addTo(map);
      var gap = (p.price && p.assessed) ? Math.round((p.price-p.assessed)/p.assessed*100) : null;
      poly.bindPopup('<b>'+esc(label(p))+'</b><br>Parcel '+esc(p.parcel)+'<br>'+
        p.acreage+' acres<br>Asking '+money(p.price)+' &middot; assessed '+money(p.assessed)+
        (gap!==null ? '<br><b>'+(gap>=0?'+':'')+gap+'%</b> over assessed' : '')+
        (WET[p.key]!==undefined ? '<br>~'+WET[p.key]+'% mapped wetland' : ''));
      bounds[p.key] = poly.getBounds();
      all.extend(poly.getBounds());
    });

    var tabs = document.getElementById('tabs');
    function mk(label, b){
      var btn=document.createElement('button'); btn.type='button'; btn.textContent=label;
      btn.addEventListener('click', function(){
        [].forEach.call(tabs.children,function(c){c.setAttribute('aria-pressed','false');});
        btn.setAttribute('aria-pressed','true');
        map.fitBounds(b, {padding:[26,26]});
      });
      tabs.appendChild(btn); return btn;
    }
    var first = mk('All '+parcels.length, all.pad(0.08));
    var tabFor = {};
    parcels.forEach(function(p){ tabFor[p.key] = mk(label(p), bounds[p.key]); });

    // Deep link: map.html?p=<key> opens straight on that lot instead of the whole
    // peninsula, so the "Parcel map" button on a card lands where you expect.
    var want = null;
    try{
      var qs = new URLSearchParams(location.search).get('p');
      if(qs){
        want = parcels.filter(function(p){ return p.key === qs; })[0] ||
               parcels.filter(function(p){
                 return p.key.toLowerCase().indexOf(qs.toLowerCase()) === 0; })[0];
      }
    }catch(e){}

    if(want && bounds[want.key]){
      first.setAttribute('aria-pressed','false');
      if(tabFor[want.key]) tabFor[want.key].setAttribute('aria-pressed','true');
      map.fitBounds(bounds[want.key], {padding:[26,26]});
      document.getElementById('note2').textContent =
        'Showing ' + label(want) + '. Use the buttons above the map for the others.';
    } else {
      first.setAttribute('aria-pressed','true');
      map.fitBounds(all.pad(0.08));
    }

    document.getElementById('sub').textContent =
      parcels.length + ' parcels from the KPB assessor, matched by street address' +
      ((P.unresolved && P.unresolved.length) ? ' · ' + P.unresolved.length + ' unresolved' : '');

    // table
    var rows = parcels.slice().sort(function(a,b){
      var ga=(a.price-a.assessed)/a.assessed, gb=(b.price-b.assessed)/b.assessed;
      return gb-ga;
    });
    var h = '<thead><tr><th>Property</th><th>Parcel</th><th class="num">Acres</th>'+
            '<th class="num">Asking</th><th class="num">Assessed</th><th class="num">Diff</th>'+
            '<th class="num">Wetland</th></tr></thead><tbody>';
    rows.forEach(function(p){
      var gap = (p.price && p.assessed) ? Math.round((p.price-p.assessed)/p.assessed*100) : null;
      h += '<tr class="row" data-k="'+esc(p.key)+'"><td>'+esc(label(p))+
           (p.verdict?' <span style="color:var(--muted);font-size:.8em">'+esc(p.verdict)+'</span>':'')+
           '</td><td class="num">'+esc(p.parcel)+'</td>'+
           '<td class="num">'+p.acreage+'</td><td class="num">'+money(p.price)+'</td>'+
           '<td class="num">'+money(p.assessed)+'</td>'+
           '<td class="num '+(gap>0?'over':'under')+'">'+(gap===null?'&ndash;':(gap>=0?'+':'')+gap+'%')+'</td>'+
           '<td class="num">'+(WET[p.key]!==undefined?WET[p.key]+'%':'&ndash;')+'</td></tr>';
    });
    document.getElementById('tbl').innerHTML = h + '</tbody>';
    [].forEach.call(document.querySelectorAll('tr.row'), function(tr){
      tr.addEventListener('click', function(){
        var b = bounds[tr.getAttribute('data-k')];
        if(b){ map.fitBounds(b,{padding:[26,26]}); document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'}); }
      });
    });

    var un = (P.unresolved||[]).join(', ');
    document.getElementById('note').innerHTML =
      '<strong>Boundaries are matched to the assessor by street address, not by map pin.</strong> '+
      'Matching on the nearest parcel to a pin returned the neighbour’s lot for ten of these, '+
      'so the address is the key. ' +
      (un ? '<strong>'+esc(un)+'</strong> has no assessor record under that number and is '+
            'deliberately left off rather than guessed. ' : '') +
      '<strong>Green is land the Borough owns and lets the public walk on; grey dashed is '+
      'Borough-owned but not on the casual-use list.</strong> Turn on “Private parcels” '+
      'to outline everything else — those are fetched live for whatever is on screen, so '+
      'zoom in past about 500 ft for them to appear. '+
      'Assessed values are the Borough’s, not an appraisal, and lag the market. '+
      'Wetland percentages exist for only three parcels and are grid-sampled estimates off the '+
      'Borough’s mapped wetlands — not a jurisdictional delineation. Transmission '+
      'centrelines come from a national dataset and can sit a couple of hundred feet off. '+
      'Nothing here replaces a plat or a survey. Rejected properties are not shown.';
  }).catch(function(e){
    document.getElementById('note').textContent = 'Could not load parcel data: ' + e;
  });
})();
</script>
</body>
</html>
