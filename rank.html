  try{ order = JSON.parse(localStorage.getItem(KEY)||"[]") || []; }catch(e){ order = []; }
  var hidden = {};
  try{ hidden = JSON.parse(localStorage.getItem(HIDDEN)||"{}") || {}; }catch(e){ hidden = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(order)); }catch(e){} }

  var inPlayOnly = true;

  function rejected(s){ return /^Rejected/i.test(s.verdict||""); }
  function pool(){
    return STOPS.filter(function(s){
      if(hidden[idOf(s)]) return false;
      if(inPlayOnly && rejected(s)) return false;
      return true;
    });
  }

  function ordered(){
    var p = pool(), byId = {};
    p.forEach(function(s){ byId[idOf(s)] = s; });
    var out = [];
    order.forEach(function(id){ if(byId[id]){ out.push(byId[id]); delete byId[id]; } });
    p.forEach(function(s){ if(byId[idOf(s)]) out.push(s); });   // newcomers go last
    return out;
  }

  function setOrder(list){
    order = list.map(idOf);
    // keep ids that are filtered out right now, so toggling the filter doesn't lose them
    var seen = {}; order.forEach(function(i){ seen[i]=1; });
    STOPS.forEach(function(s){ if(!seen[idOf(s)]) order.push(idOf(s)); });
    save(); render();
  }

  function render(){
    var list = document.getElementById("list");
    var rows = ordered();
    if(!rows.length){ list.innerHTML = '<div class="empty">Nothing to rank in this view.</div>';
                      document.getElementById("sub").textContent = ""; return; }
    list.innerHTML = rows.map(function(s, i){
      var psf = s.sqft ? Math.round(s.price/s.sqft) : null;
      var bits = [];
      if(s.cphMin!=null) bits.push("<b>"+s.cphMin+"m</b> hosp");
      if(s.tsMin!=null)  bits.push("<b>"+s.tsMin+"m</b> trails");
      // Same borough-land fact as the main list, so ranking does not need a round trip.
      if(s.land && s.land.cbig!=null) bits.push("<b>"+s.land.cbigd+"mi</b> to "+
        (s.land.cbig>=10 ? Math.round(s.land.cbig).toLocaleString() : s.land.cbig)+"ac");
      if(s.verdict) bits.push(esc(s.verdict));

      // Size on its own line: beds/baths/sqft/acres are what the ranking is actually
      // argued over, and they were only on the main page before.
      var size = [];
      size.push("<b>"+s.bed+"</b>bd");
      if(s.bath!=null) size.push("<b>"+s.bath+"</b>ba");
      if(s.sqft)    size.push("<b>"+Number(s.sqft).toLocaleString()+"</b> sqft");
      if(s.acreage!=null){
        // Leisure Lake's parcel acreage counts a wedge of lakebed, so quote the upland too.
        size.push("<b>"+s.acreage+"</b> ac"+
          (s.upland!=null ? " ("+s.upland+" dry)" : ""));
      }
      if(psf) size.push("<b>$"+psf+"</b>/sqft");
      return '<div class="drop" data-at="'+i+'"></div>'+
        '<li class="row'+(rejected(s)?' out':'')+'" draggable="true" data-id="'+idOf(s)+'">'+
          '<span class="seat">'+(i+1)+'</span>'+
          '<span class="pics">'+
            (s.face  ? '<img loading="lazy" src="'+esc(s.face)+'" alt="'+esc(shortName(s))+'">' : '')+
            (s.aerial? '<img loading="lazy" src="'+esc(s.aerial)+
                       '" alt="Aerial of '+esc(shortName(s))+'">' : '')+
          '</span>'+
          '<span class="who"><span class="nm">'+esc(shortName(s))+'</span>'+
            '<span class="meta">'+money(s.price)+' &middot; '+bits.join(" &middot; ")+'</span>'+
            '<span class="size">'+size.join(" &middot; ")+'</span></span>'+
          '<a class="open" draggable="false" href="index.html#card-'+idOf(s)+'" '+
            'title="Open the full card with its maps">Maps</a>'+
          '<span class="moves"><button type="button" data-mv="up" aria-label="Move up">&#9650;</button>'+
            '<button type="button" data-mv="down" aria-label="Move down">&#9660;</button></span>'+
          '<span class="grip" aria-hidden="true">&#8942;&#8942;</span>'+
        '</li>';
    }).join("") + '<div class="drop" data-at="'+rows.length+'"></div>';

    document.getElementById("sub").textContent =
      rows.length + " houses · drag, or use the arrows";
    wire(rows);
  }

  function move(rows, from, to){
    if(to<0 || to>=rows.length || from===to) return;
    var r = rows.slice(), it = r.splice(from,1)[0];
    r.splice(to,0,it);
    setOrder(r);
  }

  function wire(rows){
    var list = document.getElementById("list");
    var items = [].slice.call(list.querySelectorAll("li.row"));

    items.forEach(function(li, idx){
      li.querySelector('[data-mv="up"]').addEventListener("click", function(e){
        e.stopPropagation(); move(rows, idx, idx-1); });
      li.querySelector('[data-mv="down"]').addEventListener("click", function(e){
        e.stopPropagation(); move(rows, idx, idx+1); });

      li.addEventListener("dragstart", function(e){
        li.classList.add("drag");
        try{ e.dataTransfer.setData("text/plain", String(idx)); e.dataTransfer.effectAllowed="move"; }catch(err){}
      });
      li.addEventListener("dragend", function(){
        li.classList.remove("drag");
        [].forEach.call(list.querySelectorAll(".drop"), function(d){ d.classList.remove("show"); });
      });
      li.addEventListener("dragover", function(e){
        e.preventDefault();
        var box = li.getBoundingClientRect();
        var after = (e.clientY - box.top) > box.height/2;
        [].forEach.call(list.querySelectorAll(".drop"), function(d){ d.classList.remove("show"); });
        var at = idx + (after?1:0);
        var marker = list.querySelector('.drop[data-at="'+at+'"]');
        if(marker) marker.classList.add("show");
      });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var box = li.getBoundingClientRect();
        var after = (e.clientY - box.top) > box.height/2;
        var to = idx + (after?1:0);
        if(from < to) to--;
        move(rows, from, to);
      });

      // Touch: phones do not fire HTML5 drag events, so hit-test on touchmove.
      var startY = null, moved = false;
      li.addEventListener("touchstart", function(e){
        startY = e.touches[0].clientY; moved = false;
      }, {passive:true});
      li.addEventListener("touchmove", function(e){
        if(startY===null) return;
        if(Math.abs(e.touches[0].clientY-startY) < 8) return;
        moved = true; li.classList.add("drag"); e.preventDefault();
        var y = e.touches[0].clientY;
        var at = items.length;
        for(var k=0;k<items.length;k++){
          var b = items[k].getBoundingClientRect();
          if(y < b.top + b.height/2){ at = k; break; }
        }
        [].forEach.call(list.querySelectorAll(".drop"), function(d){ d.classList.remove("show"); });
        var marker = list.querySelector('.drop[data-at="'+at+'"]');
        if(marker) marker.classList.add("show");
        li._at = at;
      }, {passive:false});
      li.addEventListener("touchend", function(){
        li.classList.remove("drag");
        if(moved && li._at!=null){
          var to = li._at; if(idx < to) to--;
          move(rows, idx, to);
        }
        startY = null; li._at = null;
      });
    });
  }

  document.getElementById("inplay").addEventListener("click", function(){
    inPlayOnly = !inPlayOnly;
    this.setAttribute("aria-pressed", inPlayOnly?"true":"false");
    this.textContent = inPlayOnly ? "Still in play only" : "Showing everything";
    render();
  });
  document.getElementById("byprice").addEventListener("click", function(){
    setOrder(ordered().slice().sort(function(a,b){ return a.price-b.price; }));
  });
  document.getElementById("byhosp").addEventListener("click", function(){
    setOrder(ordered().slice().sort(function(a,b){
      return (a.cphMin==null?999:a.cphMin)-(b.cphMin==null?999:b.cphMin); }));
  });
  // Biggest first for both of these - "sort by size" meaning smallest first would be odd.
  document.getElementById("bysqft").addEventListener("click", function(){
    setOrder(ordered().slice().sort(function(a,b){
      return (b.sqft||0)-(a.sqft||0); }));
  });
  document.getElementById("byacre").addEventListener("click", function(){
    // Dry ground is what you can use, so rank on upland where the parcel includes water.
    var usable = function(s){
      return s.upland!=null ? s.upland : (s.acreage!=null ? s.acreage : 0); };
    setOrder(ordered().slice().sort(function(a,b){ return usable(b)-usable(a); }));
  });
  document.getElementById("reset").addEventListener("click", function(){
    order = []; save(); render();
  });

  // ---- lightbox: tap either thumbnail to see it big ----
  (function(){
    var box = document.createElement("div");
    box.className = "lbox"; box.hidden = true;
    box.innerHTML = '<img alt=""><div class="cap"></div>'+
      '<div class="lnav"><button type="button" data-l="prev">&larr; Prev</button>'+
      '<span class="count"></span>'+
      '<button type="button" data-l="next">Next &rarr;</button>'+
      '<button type="button" data-l="close">Close</button></div>';
    document.body.appendChild(box);
    var img = box.querySelector("img"), cap = box.querySelector(".cap");
    var cnt = box.querySelector(".count");
    var prevB = box.querySelector('[data-l="prev"]'), nextB = box.querySelector('[data-l="next"]');
    var group = [], at = 0;

    function show(i){
      if(i<0 || i>=group.length) return;
      at = i;
      img.src = group[at].src; img.alt = group[at].cap;
      cap.textContent = group[at].cap;
      cnt.textContent = (at+1)+" / "+group.length;
      prevB.disabled = at===0; nextB.disabled = at===group.length-1;
      box.hidden = false;
    }
    function close(){ box.hidden = true; img.removeAttribute("src"); group = []; }

    document.getElementById("list").addEventListener("click", function(e){
      var t = e.target;
      if(!(t && t.tagName === "IMG")) return;
      var strip = t.closest(".pics");
      if(!strip) return;
      e.preventDefault(); e.stopPropagation();
      var imgs = [].slice.call(strip.querySelectorAll("img"));
      group = imgs.map(function(im){
        return { src: im.getAttribute("src"), cap: im.alt || "" };
      });
      show(imgs.indexOf(t));
    }, true);

    box.addEventListener("click", function(e){
      var b = e.target.closest("button");
      if(!b){ if(e.target === box || e.target === img) close(); return; }
      var w = b.getAttribute("data-l");
      if(w === "close") close();
      else if(w === "prev") show(at-1);
      else if(w === "next") show(at+1);
    });
    document.addEventListener("keydown", function(e){
      if(box.hidden) return;
      if(e.key === "Escape") close();
      else if(e.key === "ArrowLeft") show(at-1);
      else if(e.key === "ArrowRight") show(at+1);
    });
  })();

  document.getElementById("foot").innerHTML =
    'Your order is saved on this device only — it is not shared and nothing is sent anywhere. '+
    'Houses crossed off on the tour sheet are hidden unless you switch the first button; '+
    'anything you hid on the main page stays hidden here too. '+
    'Drag the row, or use the arrows if dragging is fiddly.';

  render();
})();
</script>
</body>
</html>
